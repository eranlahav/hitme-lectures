<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<title>הדרכת קלוד, צעד אחרי צעד · HIT ME</title>
<!--
  How to edit: every slide is one object in the SLIDES list at the bottom.
  Change the Hebrew text in "do", or the English labels inside the mock screens.
  Mock screens are built from small helpers (sidebar, settings, project, chat, github).
  Labels follow the Claude site; design is intentionally schematic.
  Prompt texts must stay identical to the copy blocks in ../index.html.
-->
<style>
@font-face { font-family: 'IBM Plex Sans Hebrew'; font-weight: 400; font-display: swap; src: url(../../assets/fonts/ibm-plex-sans-hebrew-hebrew-400-normal.woff2) format('woff2'); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: 'IBM Plex Sans Hebrew'; font-weight: 700; font-display: swap; src: url(../../assets/fonts/ibm-plex-sans-hebrew-hebrew-700-normal.woff2) format('woff2'); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
:root { --bg:#f5f4f0; --text:#141828; --text-2:#535a6e; --accent:#0a7a83; --accent-soft:rgba(20,163,174,.12); --line:rgba(20,24,40,.12); --hl:#e0218a; --ui:#faf9f5; --ui-side:#f0eee6; --ui-text:#1f1e1d; --ui-2:#73726c; --ui-brand:#c96442; }
* { box-sizing: border-box; }
body { margin:0; font-family:'IBM Plex Sans Hebrew',system-ui,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px 16px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:5; }
header a.home { color:var(--accent); text-decoration:none; font-weight:700; }
header select { font:inherit; padding:4px 8px; border-radius:8px; border:1px solid var(--line); background:#fff; max-width:100%; }
.count { color:var(--text-2); font-size:14px; margin-inline-start:auto; }
.nav { display:flex; gap:6px; }
.nav button { font:inherit; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; }
.nav button.next { background:var(--accent); color:#fff; border-color:var(--accent); }
.nav button:disabled { opacity:.4; cursor:default; }
.bar { height:4px; background:var(--accent-soft); }
.bar i { display:block; height:100%; background:var(--accent); transition:width .2s; }
main { display:grid; grid-template-columns: minmax(260px, 360px) 1fr; gap:20px; padding:20px 16px 40px; max-width:1300px; margin:0 auto; }
.panel .ch { font-size:13px; color:var(--accent); font-weight:700; }
.panel h1 { font-size:24px; line-height:1.3; margin:4px 0 10px; }
.panel .do { font-size:16px; }
.panel .do p { margin:0 0 10px; }
.panel .skip { background:#fff4d6; border-inline-start:4px solid #e8b100; padding:8px 12px; border-radius:8px; font-size:14px; margin:10px 0; }
.panel .why { color:var(--text-2); font-size:14px; border-top:1px solid var(--line); padding-top:8px; margin-top:12px; }
.copy { position:relative; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0 12px; white-space:pre-wrap; font-size:14px; }
.copy.ltr { direction:ltr; text-align:left; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
.copy button { position:absolute; top:6px; inset-inline-end:6px; font:inherit; font-size:12px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); background:var(--accent-soft); cursor:pointer; direction:rtl; }
.copy .t { display:block; padding-inline-end:56px; }
.copy.ltr .t { padding-inline-end:0; padding-right:56px; }
/* mock window */
.win { direction:ltr; text-align:left; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--ui); box-shadow:0 8px 28px rgba(20,24,40,.08); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; color:var(--ui-text); font-size:14px; align-self:start; }
.url { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#e9e7e1; border-bottom:1px solid var(--line); font-size:12px; color:var(--ui-2); }
.url .dots { display:flex; gap:5px; } .url .dots i { width:10px; height:10px; border-radius:50%; background:#cfccc4; display:block; }
.url .addr { flex:1; background:#fff; border-radius:6px; padding:3px 10px; }
.app { display:flex; min-height:440px; }
.side { width:190px; flex:none; background:var(--ui-side); border-right:1px solid var(--line); padding:12px 8px; display:flex; flex-direction:column; gap:2px; }
.side .brand { font-weight:700; padding:4px 8px 10px; }
.side .it { padding:6px 8px; border-radius:8px; color:var(--ui-text); }
.side .it.on { background:#e3e0d6; font-weight:600; }
.side .sec { font-size:11px; color:var(--ui-2); padding:10px 8px 2px; }
.side .grow { flex:1; }
.side .user { display:flex; align-items:center; gap:8px; padding:8px; border-top:1px solid var(--line); }
.av { width:24px; height:24px; border-radius:50%; background:var(--ui-brand); color:#fff; display:grid; place-items:center; font-size:12px; font-weight:700; }
.menu { margin:0 8px 6px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:4px; box-shadow:0 6px 16px rgba(0,0,0,.08); }
.menu div { padding:6px 8px; border-radius:6px; }
.main { flex:1; padding:20px 24px; min-width:0; }
.main h2 { font-size:20px; margin:0 0 14px; font-weight:600; }
.main h3 { font-size:14px; margin:16px 0 6px; font-weight:600; }
.muted { color:var(--ui-2); font-size:13px; }
.setwrap { display:flex; gap:20px; }
.setnav { width:130px; flex:none; display:flex; flex-direction:column; gap:2px; }
.setnav div { padding:6px 10px; border-radius:8px; }
.setnav .on { background:#e9e6dc; font-weight:600; }
.setbody { flex:1; min-width:0; }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; margin-bottom:8px; }
.btn { display:inline-block; padding:5px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:13px; white-space:nowrap; }
.btn.dark { background:var(--ui-text); color:#fff; border-color:var(--ui-text); }
.btn.green { background:#1f883d; color:#fff; border-color:#1f883d; }
.tog { width:34px; height:20px; border-radius:999px; background:#cfccc4; position:relative; flex:none; }
.tog::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; }
.tog.on { background:#2c84db; } .tog.on::after { left:16px; }
.field { border:1px solid var(--line); border-radius:10px; background:#fff; padding:10px 12px; min-height:38px; white-space:pre-wrap; font-size:13px; }
.field.rtl { direction:rtl; text-align:right; font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif; }
.cols { display:flex; gap:16px; } .cols > div { flex:1; min-width:0; }
.card { border:1px solid var(--line); border-radius:12px; background:#fff; padding:12px; margin-bottom:10px; }
.file { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; } .file:last-child { border:0; }
.file i { width:22px; height:26px; border:1px solid var(--line); border-radius:4px; background:#f7f6f2; display:block; flex:none; }
.msg { max-width:85%; padding:10px 12px; border-radius:12px; margin:8px 0; white-space:pre-wrap; font-size:13px; direction:rtl; text-align:right; font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif; }
.msg.me { background:#e9e6dc; margin-left:auto; }
.msg.ai { background:#fff; border:1px solid var(--line); }
.composer { border:1px solid var(--line); border-radius:14px; background:#fff; padding:12px; margin-top:12px; color:var(--ui-2); }
.gh { background:#fff; }
.gh .ghbar { background:#24292f; color:#fff; padding:10px 16px; font-weight:600; }
.gh .body { padding:24px; }
.merged { display:inline-block; background:#8250df; color:#fff; border-radius:999px; padding:3px 12px; font-size:13px; font-weight:600; }
/* highlight */
[data-hl] { outline:3px solid var(--hl); outline-offset:2px; border-radius:8px; position:relative; animation:pulse 1.6s ease-in-out infinite; }
[data-hl]::before { content:attr(data-hl); position:absolute; top:-12px; left:-12px; width:22px; height:22px; border-radius:50%; background:var(--hl); color:#fff; font-size:12px; font-weight:700; display:grid; place-items:center; z-index:2; }
@keyframes pulse { 50% { outline-color:rgba(224,33,138,.35); } }
@media (prefers-reduced-motion: reduce) { [data-hl] { animation:none; } }
.layers { width:100%; border-collapse:collapse; direction:rtl; text-align:right; font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif; }
.layers th, .layers td { border:1px solid var(--line); padding:8px 10px; vertical-align:top; }
.layers th { background:#efede6; }
.cover { padding:40px 28px; direction:rtl; text-align:right; font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif; }
.cover ol { padding-inline-start:20px; } .cover li { margin:4px 0; }
.hint { font-size:13px; color:var(--text-2); margin-top:10px; }
@media (max-width: 860px) {
  main { grid-template-columns: 1fr; }
  .side { width:120px; font-size:12px; }
  .setnav { width:96px; font-size:12px; }
  .main { padding:14px; }
  .cols { flex-direction:column; }
  .app { min-height:0; }
}
@media (max-width: 520px) { .side { display:none; } .setwrap { flex-direction:column; } .setnav { flex-direction:row; flex-wrap:wrap; width:auto; } }
</style>
</head>
<body>
<header>
  <a class="home" href="../">הדרכת קלוד</a>
  <select id="chap" aria-label="לקפוץ לפרק"></select>
  <span class="count" id="count"></span>
  <div class="nav"><button type="button" id="prev">הקודם</button><button type="button" class="next" id="next">הבא</button></div>
</header>
<div class="bar"><i id="bar"></i></div>
<main>
  <section class="panel" aria-live="polite">
    <div class="ch" id="ch"></div>
    <h1 id="title"></h1>
    <div class="do" id="do"></div>
  </section>
  <div id="screen"></div>
</main>
<script>
var P = {"prefs": "אני סטודנט/ית לתקשורת חזותית בשנה ד' ב־HIT, בקורס \"עיצוב החלטות\".\nענה לי בעברית פשוטה, בלי לערבב מילים באנגלית בתוך משפטים.\nפקודות ושמות קבצים, כתוב בשורה נפרדת.\nכשאתה לא בטוח, תגיד. כשמשהו הוא הנחה ולא עובדה, סמן אותו.\nאל תחמיא לי. אם הרעיון שלי חלש, תגיד למה.", "github": "https://claude.ai/connect-github", "name": "HIT ME · עיצוב החלטות", "instructions": "אני [שם], סטודנט/ית בקורס \"עיצוב החלטות\" ב־HIT. שם המשתמש שלי בגיטהאב: [שם משתמש].\nהכיתה בונה יחד את HIT ME, האפליקציה הלא רשמית של הסטודנטים במכון.\nהעבודה מתנהלת במאגר eranlahav/hitme. המטלות שלי נמצאות בתיקיות שלי בתוך assignments.\nאיפה אנחנו: שלב המחקר. מנסים להבין את הסטודנטים ב־HIT לפני שמחליטים על פתרונות.\nכללים:\n1. הפרד תמיד בין ראיה (מה נאסף, עם מקור) לבין פרשנות.\n2. כשאתה מסתמך על קובץ, ציין את שמו. אל תמציא נתונים, ציטוטים או מספרים.\n3. רעיון לפתרון שעולה, רשום בסוף תחת \"חניית פתרונות\".\n4. בסוף כל ניתוח, כתוב מה צריך אימות אנושי ואיך לבדוק.\n5. בלי שמות ופרטים מזהים של משתתפי מחקר.\n6. במאגר: עבוד רק בתיקיות שלי. אל תדחוף לענף הראשי ואל תמזג.\n7. את הנימוק להחלטה שלי, שאל אותי. אל תכתוב אותו במקומי.\n8. ענה בעברית פשוטה. פקודות ושמות קבצים בשורה נפרדת.", "repo": "eranlahav/hitme", "memory": "תראה לי מה שמור בזיכרון של הפרויקט, ותמחק את מה שכבר לא נכון.", "design": "https://claude.ai/design", "finish": "אני מגיש/ה את משימת הסיום של הדרכת קלוד בקורס עיצוב החלטות.\nתמשוך את הגרסה העדכנית, ותקרא את assignments/00-claude-setup/README.md.\nתעבור איתי על רשימת הבדיקה מההדרכה, שורה אחת בכל פעם, ותשאל אותי אם היא מוכנה.\nתכתוב את setup.md לפי ארבעת החלקים. מהקבצים, רק שמות. את התוכן של הקובץ הפרטי שלי אל תעתיק.\nתראה לי את הקובץ, ורק אחרי שאישרתי תגיש אותו לתיקייה שלי ותפתח בקשת מיזוג."};

/* ---------- small builders for the mock Claude screens ---------- */
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function h(n, on){ return on ? ' data-hl="'+n+'"' : ''; }
function win(url, inner){ return '<div class="win"><div class="url"><span class="dots"><i></i><i></i><i></i></span><span class="addr">'+url+'</span></div>'+inner+'</div>'; }
function sidebar(opt){
  opt = opt || {};
  var items = ['New chat','Chats','Projects','Artifacts','Code'];
  var s = '<nav class="side"><div class="brand">Claude</div>';
  items.forEach(function(it){
    var on = opt.active === it;
    var hl = opt.hl === it;
    s += '<div class="it'+(on?' on':'')+'"'+(hl?' data-hl="1"':'')+'>'+it+'</div>';
  });
  if (opt.recents) { s += '<div class="sec">Recents</div>'; opt.recents.forEach(function(r){ s += '<div class="it">'+r+'</div>'; }); }
  s += '<div class="grow"></div>';
  if (opt.menu) s += '<div class="menu"><div>'+'Your name'+'</div><div'+h(2,true)+'>Settings</div><div>Help</div><div>Log out</div></div>';
  s += '<div class="user"'+h(1, opt.userHl)+'><span class="av">S</span><span>Student</span></div></nav>';
  return s;
}
function app(side, main){ return '<div class="app">'+side+'<div class="main">'+main+'</div></div>'; }
function settings(tab, body){
  var tabs = ['General','Account','Privacy','Billing','Capabilities','Connectors'];
  var nav = '<div class="setnav">'+tabs.map(function(t){ return '<div class="'+(t===tab?'on':'')+'">'+t+'</div>'; }).join('')+'</div>';
  return win('claude.ai/settings/'+tab.toLowerCase(), app(sidebar({}), '<h2>Settings</h2><div class="setwrap">'+nav+'<div class="setbody">'+body+'</div></div>'));
}
function project(body, opt){
  opt = opt || {};
  return win('claude.ai/project/…', app(sidebar({active:'Projects', recents: opt.recents}), '<div class="muted">Projects /</div><h2>HIT ME · עיצוב החלטות</h2>'+body));
}
function chat(title, msgs, composer){
  var m = msgs.map(function(x){ return '<div class="msg '+x[0]+'">'+x[1]+'</div>'; }).join('');
  return win('claude.ai/…', app(sidebar({active:'Projects'}), '<div class="muted">HIT ME · עיצוב החלטות /</div><h2>'+title+'</h2>'+m+(composer?'<div class="composer">'+composer+'</div>':'')));
}
function copy(text, ltr){ return '<div class="copy'+(ltr?' ltr':'')+'"><button type="button">העתק</button><span class="t">'+esc(text)+'</span></div>'; }
function skip(t){ return '<div class="skip"><b>כבר עשיתם?</b> '+t+'</div>'; }

/* ---------- the slides ---------- */
var SLIDES = [
 { ch:'פתיחה', title:'איך משתמשים במצגת הזו',
   do:'<p>פותחים את המצגת בחצי מסך, ואת קלוד בחצי השני. עוברים צעד אחרי צעד: בכל צעד רואים איך המסך בקלוד אמור להיראות, ומה ללחוץ. הדבר שלוחצים עליו מסומן במסגרת ורודה.</p><p>מעבר בין צעדים: בכפתורים למעלה, או בחצים במקלדת. מי שכבר עשה פרק, בוחר את הפרק הבא ברשימה למעלה.</p>',
   screen: function(){ return win('claude.ai', '<div class="cover"><h2 style="margin-top:0">הדרכת קלוד לקורס</h2><ol><li>חיבור גיטהאב לקלוד</li><li>פרויקט הקורס והנחיות</li><li>קבצים וזיכרון</li><li>הגדרות החשבון</li><li>שרשורים</li><li>משימת הסיום</li><li>קלוד דיזיין</li></ol><p class="hint">שמות הכפתורים בקלוד משתנים לפעמים. אם משהו לא נמצא בדיוק במקום, חפשו שם דומה, או שאלו את קלוד עצמו איפה זה.</p></div>'); } },
 { ch:'פתיחה', title:'ארבע שכבות של הגדרות',
   do:'<p>רוב הבלבול בקלוד מגיע מזה שלא יודעים באיזו שכבה נמצאת הגדרה. מה שנכון תמיד, עולה לשכבה גבוהה. מה שנכון רק למשימה אחת, נשאר בשיחה.</p>',
   screen: function(){ return win('claude.ai', '<div class="cover"><table class="layers"><tr><th>שכבה</th><th>מה יש בה</th><th>על מה היא חלה</th></tr><tr><td>החשבון</td><td>העדפות אישיות, זיכרון כללי, חיבורים</td><td>כל שיחה וכל פרויקט</td></tr><tr><td>הפרויקט</td><td>הנחיות, מאגר, קבצים, זיכרון של הפרויקט</td><td>כל השיחות בפרויקט</td></tr><tr><td>השיחה (שרשור)</td><td>משימה אחת עם מטרה אחת</td><td>רק השיחה הזו</td></tr><tr><td>המחשב (קלוד קוד)</td><td>קובץ הוראות אישי, הרשאות, תיקיות</td><td>עבודה על קבצים במחשב שלי</td></tr></table></div>'); } },

 { ch:'1. חיבור גיטהאב', title:'פותחים את ההגדרות',
   do: skip('אם בהגדרות, בחלק של החיבורים, גיטהאב כבר מחובר, דלגו לפרק 2.')+'<p>לוחצים על השם שלכם בפינה למטה (1), ואז על ההגדרות (2).</p>',
   screen: function(){ return win('claude.ai', app(sidebar({userHl:true, menu:true}), '<h2>Good afternoon</h2><div class="composer">How can I help you today?</div>')); } },
 { ch:'1. חיבור גיטהאב', title:'מחברים את גיטהאב',
   do:'<p>בהגדרות, בוחרים בחיבורים. ליד גיטהאב לוחצים על כפתור החיבור (1).</p><p>אפשר גם לפתוח ישר את הקישור הזה:</p>'+copy(P.github, true),
   screen: function(){ return settings('Connectors', '<div class="row"><div><b>GitHub</b><div class="muted">Repositories, issues, pull requests</div></div><span class="btn dark"'+h(1,true)+'>Connect</span></div><div class="row"><div><b>Google Drive</b><div class="muted">Docs, Sheets and files</div></div><span class="btn">Connect</span></div><div class="row"><div><b>Figma</b></div><span class="btn">Connect</span></div>'); } },

/* ---------- player ---------- */
var i = 0;
var sel = document.getElementById('chap');
var chapters = [];
SLIDES.forEach(function(s, k){ if (chapters.indexOf(s.ch) < 0) { chapters.push(s.ch); var o = document.createElement('option'); o.value = k; o.textContent = s.ch; sel.appendChild(o); } });
function show(n){
  i = Math.max(0, Math.min(SLIDES.length - 1, n));
  var s = SLIDES[i];
  document.getElementById('ch').textContent = s.ch;
  document.getElementById('title').textContent = s.title;
  document.getElementById('do').innerHTML = s.do;
  document.getElementById('screen').innerHTML = s.screen();
  document.getElementById('count').textContent = (i + 1) + ' מתוך ' + SLIDES.length;
  document.getElementById('bar').style.width = ((i + 1) / SLIDES.length * 100) + '%';
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === SLIDES.length - 1;
  var first = 0; SLIDES.forEach(function(x, k){ if (x.ch === s.ch && k <= i && (k === 0 || SLIDES[k-1].ch !== s.ch)) first = k; });
  sel.value = String(first);
  try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
}
document.getElementById('prev').onclick = function(){ show(i - 1); };
document.getElementById('next').onclick = function(){ show(i + 1); };
sel.onchange = function(){ show(parseInt(sel.value, 10)); };
document.addEventListener('keydown', function(e){
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft' || e.key === 'PageDown') show(i + 1);
  if (e.key === 'ArrowRight' || e.key === 'PageUp') show(i - 1);
});
document.addEventListener('click', function(e){
  var b = e.target.closest('.copy button'); if (!b) return;
  var t = b.parentNode.querySelector('.t').textContent;
  var done = function(){ b.textContent = 'הועתק'; setTimeout(function(){ b.textContent = 'העתק'; }, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function(){}); 
});
var start = parseInt((location.hash || '#1').slice(1), 10);
show(isNaN(start) ? 0 : start - 1);
</script>
