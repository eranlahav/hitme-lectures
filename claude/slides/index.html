<style>
@font-face { font-family: 'IBM Plex Sans Hebrew'; font-weight: 400; font-display: swap; src: url(../../assets/fonts/ibm-plex-sans-hebrew-hebrew-400-normal.woff2) format('woff2'); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: 'IBM Plex Sans Hebrew'; font-weight: 700; font-display: swap; src: url(../../assets/fonts/ibm-plex-sans-hebrew-hebrew-700-normal.woff2) format('woff2'); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
:root { --bg:#f5f4f0; --text:#141828; --text-2:#535a6e; --accent:#0a7a83; --accent-soft:rgba(20,163,174,.12); --line:rgba(20,24,40,.12); --hl:#e0218a; --ui:#faf9f5; --ui-side:#f0eee6; --ui-text:#1f1e1d; --ui-2:#73726c; --ui-brand:#c96442; }
* { box-sizing: border-box; }
body { margin:0; font-family:'IBM Plex Sans Hebrew',system-ui,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px 16px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:5; }
header a.home { color:var(--accent); text-decoration:none; font-weight:700; }
header select { font:inherit; padding:4px 8px; border-radius:8px; border:1px solid var(--line); background:#fff; max-width:100%; }
.count { color:var(--text-2); font-size:14px; margin-inline-start:auto; }
.nav { display:flex; gap:6px; }
.nav button { font:inherit; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; }
.nav button.next { background:var(--accent); color:#fff; border-color:var(--accent); }
.nav button:disabled { opacity:.4; cursor:default; }
.bar { height:4px; background:var(--accent-soft); }
.bar i { display:block; height:100%; background:var(--accent); transition:width .2s; }
main { display:grid; grid-template-columns: minmax(280px, 380px) 1fr; gap:20px; padding:20px 16px 40px; max-width:1300px; margin:0 auto; }
.panel { min-width:0; }
.panel .ch { font-size:13px; color:var(--accent); font-weight:700; }
.panel h1 { font-size:24px; line-height:1.3; margin:4px 0 10px; }
.panel .do { font-size:16px; }
.panel .do p { margin:0 0 10px; }
.panel .skip { background:#fff4d6; border-inline-start:4px solid #e8b100; padding:8px 12px; border-radius:8px; font-size:14px; margin:10px 0; }
.panel .why { color:var(--text-2); font-size:14px; border-top:1px solid var(--line); padding-top:8px; margin-top:12px; }
/* copy box: header row with the button, editable text below, so nothing overlaps */
.copy { background:#fff; border:1px solid var(--line); border-radius:10px; margin:8px 0 12px; overflow:hidden; }
.copy .head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 8px 5px 10px; background:#f7f6f2; border-bottom:1px solid var(--line); font-size:12px; color:var(--text-2); }
.copy .head button { font:inherit; font-size:12px; padding:2px 12px; border-radius:999px; border:1px solid var(--line); background:var(--accent-soft); cursor:pointer; flex:none; }
.copy .t { display:block; padding:10px 12px; white-space:pre-wrap; font-size:14px; overflow-wrap:anywhere; outline:none; }
.copy .t[contenteditable]:focus { background:#fffbea; }
.copy .t mark { background:#ffe58a; color:inherit; border-radius:3px; padding:0 2px; }
.copy.ltr .t { direction:ltr; text-align:left; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
/* mock desktop app window */
.win { direction:ltr; text-align:left; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--ui); box-shadow:0 8px 28px rgba(20,24,40,.08); font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; color:var(--ui-text); font-size:14px; align-self:start; min-width:0; }
.tbar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#e9e7e1; border-bottom:1px solid var(--line); font-size:12px; color:var(--ui-2); }
.tbar .dots { display:flex; gap:5px; } .tbar .dots i { width:10px; height:10px; border-radius:50%; background:#cfccc4; display:block; }
.tbar .ttl { flex:1; text-align:center; }
.app { display:flex; min-height:460px; position:relative; }
.app.tall { min-height:640px; }
.side { width:180px; flex:none; background:var(--ui-side); border-right:1px solid var(--line); padding:10px 8px; display:flex; flex-direction:column; gap:1px; }
.side .modes { display:flex; gap:4px; padding:0 4px 8px; }
.side .modes span { flex:1; text-align:center; padding:3px 0; border-radius:6px; font-size:12px; }
.side .modes .on { background:#fff; font-weight:600; }
.side .it { padding:5px 8px; border-radius:8px; color:var(--ui-text); }
.side .it.on { background:#e3e0d6; font-weight:600; }
.side .sec { font-size:11px; color:var(--ui-2); padding:10px 8px 2px; }
.side .grow { flex:1; }
.side .user { display:flex; align-items:center; gap:8px; padding:8px; border-top:1px solid var(--line); }
.side .user .plan { color:var(--ui-2); font-size:12px; }
.av { width:24px; height:24px; border-radius:50%; background:var(--ui-brand); color:#fff; display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; }
.menu { margin:0 8px 6px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:4px; box-shadow:0 6px 16px rgba(0,0,0,.08); }
.menu div { padding:6px 8px; border-radius:6px; }
.main { flex:1; padding:20px 24px; min-width:0; }
.main h2 { font-size:20px; margin:0 0 14px; font-weight:600; }
.main h3 { font-size:14px; margin:16px 0 6px; font-weight:600; }
.muted { color:var(--ui-2); font-size:13px; }
/* modal (settings / project settings) */
.shade { position:absolute; inset:0; background:rgba(20,20,20,.25); display:flex; align-items:center; justify-content:center; padding:14px; }
.modal { background:var(--ui); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.18); width:100%; max-width:760px; display:flex; min-height:400px; overflow:hidden; }
.mnav { width:150px; flex:none; border-right:1px solid var(--line); padding:12px 8px; display:flex; flex-direction:column; gap:1px; font-size:13px; }
.mnav .t { font-weight:700; padding:2px 8px 8px; }
.mnav div.i { padding:4px 8px; border-radius:7px; }
.mnav div.i.on { background:#e3e0d6; font-weight:600; }
.mnav hr { border:0; border-top:1px solid var(--line); margin:6px 4px; width:auto; }
.mbody { flex:1; padding:16px 20px; min-width:0; }
.mbody h2 { font-size:18px; margin:0 0 12px; }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; margin-bottom:8px; }
.btn { display:inline-block; padding:4px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:13px; white-space:nowrap; }
.btn.dark { background:var(--ui-text); color:#fff; border-color:var(--ui-text); }
.btn.green { background:#1f883d; color:#fff; border-color:#1f883d; }
.tog { width:34px; height:20px; border-radius:999px; background:#cfccc4; position:relative; flex:none; }
.tog::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; }
.tog.on { background:#2c84db; } .tog.on::after { left:16px; }
.field { border:1px solid var(--line); border-radius:10px; background:#fff; padding:8px 12px; min-height:36px; white-space:pre-wrap; font-size:13px; max-height:150px; overflow:hidden; }
.field.rtl { direction:rtl; text-align:right; font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif; }
.lbl { font-weight:600; font-size:13px; margin:12px 0 2px; }
.lbl:first-child { margin-top:0; }
.sub { color:var(--ui-2); font-size:12px; margin-bottom:6px; }
.tabs { display:flex; gap:14px; border-bottom:1px solid var(--line); margin-bottom:10px; font-size:13px; }
.tabs span { padding:4px 0; }
.tabs .on { border-bottom:2px solid var(--ui-text); font-weight:600; }
.pills { display:flex; gap:6px; align-items:center; margin-bottom:10px; font-size:12px; flex-wrap:wrap; }
.pills span { padding:2px 10px; border-radius:999px; border:1px solid var(--line); background:#fff; }
.pills .on { background:var(--ui-text); color:#fff; }
.pills .grow { flex:1; border:0; background:none; padding:0; }
.tbl { font-size:13px; }
.tbl .tr { display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px; padding:7px 6px; border-bottom:1px solid var(--line); }
.tbl .tr.th { color:var(--ui-2); padding-top:2px; }
.ok { color:#1f883d; }
.card { border:1px solid var(--line); border-radius:12px; background:#fff; padding:12px; margin-bottom:10px; }
.file { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; } .file:last-child { border:0; }
.file i { width:22px; height:26px; border:1px solid var(--line); border-radius:4px; background:#f7f6f2; display:block; flex:none; }
.msg { max-width:85%; padding:10px 12px; border-radius:12px; margin:8px 0; white-space:pre-wrap; font-size:13px; direction:rtl; text-align:right; font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif; }
.msg.me { background:#e9e6dc; margin-left:auto; }
.msg.ai { background:#fff; border:1px solid var(--line); }
.composer { border:1px solid var(--line); border-radius:14px; background:#fff; padding:12px; margin-top:12px; color:var(--ui-2); }
.chips { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
.chips span { display:inline-flex; gap:6px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:3px 8px; background:#f7f6f2; font-size:12px; color:var(--ui-text); }
.gh { background:#fff; }
.gh .ghbar { background:#24292f; color:#fff; padding:10px 16px; font-weight:600; }
.gh .body { padding:24px; }
.merged { display:inline-block; background:#8250df; color:#fff; border-radius:999px; padding:3px 12px; font-size:13px; font-weight:600; }
/* highlight */
[data-hl] { outline:3px solid var(--hl); outline-offset:2px; border-radius:8px; position:relative; animation:pulse 1.6s ease-in-out infinite; }
[data-hl]::before { content:attr(data-hl); position:absolute; top:-12px; left:-12px; width:22px; height:22px; border-radius:50%; background:var(--hl); color:#fff; font-size:12px; font-weight:700; display:grid; place-items:center; z-index:2; }
@keyframes pulse { 50% { outline-color:rgba(224,33,138,.35); } }
@media (prefers-reduced-motion: reduce) { [data-hl] { animation:none; } }
.layers { width:100%; border-collapse:collapse; direction:rtl; text-align:right; font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif; }
.layers th, .layers td { border:1px solid var(--line); padding:8px 10px; vertical-align:top; }
.layers th { background:#efede6; }
.cover { padding:36px 28px; direction:rtl; text-align:right; font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif; }
.cover ol { padding-inline-start:20px; } .cover li { margin:4px 0; }
.hint { font-size:13px; color:var(--text-2); margin-top:10px; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  .side { width:120px; font-size:12px; }
  .mnav { width:110px; font-size:12px; }
  .main { padding:14px; }
  .app { min-height:0; }
}
@media (max-width: 560px) {
  .side { display:none; }
  .shade { position:static; background:none; padding:0; }
  .app.tall { min-height:0; }
  .app.tall > .main { display:none; }
  .shade { flex:1; min-width:0; }
  .modal { flex-direction:column; box-shadow:none; border-radius:0; min-height:0; }
  .mnav { width:auto; flex-direction:row; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--line); }
  .mnav hr, .mnav .t { display:none; }
  .tbl .tr { grid-template-columns:1.4fr 1fr; overflow-wrap:anywhere; }
  .tbl .tr > :nth-child(2) { display:none; }
  .mbody { padding:12px; }
}
</style>

var P = {"name": "HIT ME · עיצוב החלטות", "goal": "אני [שם], סטודנט/ית ל[מחלקה] בשנה [שנה] ב־HIT, בקורס \"עיצוב החלטות\".\nבקורס הכיתה בונה יחד את HIT ME, אפליקציה לסטודנטים במכון.\nבפרויקט הזה אני רוצה לעבוד על המטלות שלי, להגיש אותן למאגר, ולדעת בכל רגע מה החוליה שלי עושה.\nהשבוע אני בחוליית [שם החוליה], ואחראי/ת על [הנושא שלי].\nמה שהכי יעזור לי: [למשל: תזכורות למועדים, עזרה בניסוח, בדיקה שהראיות שלי חזקות].", "instructions": "אני [שם], סטודנט/ית בקורס \"עיצוב החלטות\" ב־HIT. שם המשתמש שלי בגיטהאב: [שם משתמש].\nהכיתה בונה יחד את HIT ME, האפליקציה הלא רשמית של הסטודנטים במכון.\nהעבודה מתנהלת במאגר eranlahav/hitme. המטלות שלי נמצאות בתיקיות שלי בתוך assignments.\nאיפה אנחנו: שלב המחקר. מנסים להבין את הסטודנטים ב־HIT לפני שמחליטים על פתרונות.\nאיך נוח לי לעבוד: [למשל: צעדים קצרים, דוגמה לפני הסבר, שאלה אחת בכל פעם].\nכללים:\n1. הפרד תמיד בין ראיה (מה נאסף, עם מקור) לבין פרשנות.\n2. כשאתה מסתמך על קובץ, ציין את שמו. אל תמציא נתונים, ציטוטים או מספרים.\n3. רעיון לפתרון שעולה, רשום בסוף תחת \"חניית פתרונות\".\n4. בסוף כל ניתוח, כתוב מה צריך אימות אנושי ואיך לבדוק.\n5. בלי שמות ופרטים מזהים של משתתפי מחקר.\n6. במאגר: עבוד רק בתיקיות שלי. אל תדחוף לענף הראשי ואל תמזג.\n7. את הנימוק להחלטה שלי, שאל אותי. אל תכתוב אותו במקומי.\n8. ענה בעברית פשוטה. פקודות ושמות קבצים בשורה נפרדת.", "repo": "eranlahav/hitme", "files": "צירפתי שני קבצים: קובץ ההקשר הציבורי שלי, וקובץ ההקשר הפרטי שלי.\nתקרא את שניהם, ותשמור בזיכרון של הפרויקט את מה שחשוב כדי לעבוד איתי טוב.\nחשוב לי במיוחד שתזכור: [למשל: איך אני לומד/ת, במה אני חזק/ה, במה אני רוצה להשתפר, איך אני רוצה לקבל משוב].\nאת הקובץ הפרטי לעולם אל תעלה למאגר, ואל תצטט ממנו בקבצים שאני מגיש/ה.\nבסוף תראה לי מה שמרת.", "memory": "תראה לי מה שמור בזיכרון של הפרויקט, ותמחק את מה שכבר לא נכון.", "prefs": "אני [שם], סטודנט/ית ל[מחלקה] בשנה [שנה] ב־HIT.\nענה לי ב[עברית פשוטה], בלי לערבב מילים באנגלית בתוך משפטים.\nפקודות ושמות קבצים, כתוב בשורה נפרדת.\nכשאתה לא בטוח, תגיד. כשמשהו הוא הנחה ולא עובדה, סמן אותו.\nאל תחמיא לי. אם הרעיון שלי חלש, תגיד למה.\nעוד דבר שחשוב לי: [למשל: תשובות קצרות, דוגמאות מעולם העיצוב].", "finish": "אני מגיש/ה את משימת הסיום של הדרכת קלוד בקורס עיצוב החלטות.\nתמשוך את הגרסה העדכנית, ותקרא את assignments/00-claude-setup/README.md.\nתעבור איתי על רשימת הבדיקה מההדרכה, שורה אחת בכל פעם, ותשאל אותי אם היא מוכנה.\nתכתוב את setup.md לפי ארבעת החלקים. מהקבצים, רק שמות. את התוכן של הקובץ הפרטי שלי אל תעתיק.\nתראה לי את הקובץ, ורק אחרי שאישרתי תגיש אותו לתיקייה שלי ותפתח בקשת מיזוג.", "sync": "תמשוך את הגרסה העדכנית של המאגר.\nאני בחוליית [שם החוליה], ואחראי/ת על הנושא [הנושא שלי].\nתביא לי את כל מה שנוסף לאחרונה ונוגע אליי: דוחות של החוליות, קבצים של חברי החוליה שלי, ושינויים בהוראות של המטלות.\nלכל דבר, כתוב את שם הקובץ ומה חדש בו.\nבסוף, תגיד לי מה כדאי לי לעשות עכשיו."};

/* ---------- small builders for the mock Claude desktop app ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function marks(s){ return esc(s).replace(/\[[^\]\n]+\]/g, '<mark>$&</mark>'); }
function h(n, on){ return on ? ' data-hl="'+n+'"' : ''; }
function win(inner){ return '<div class="win"><div class="tbar"><span class="dots"><i></i><i></i><i></i></span><span class="ttl">Claude</span></div>'+inner+'</div>'; }
/* opt: active (item name), hl (item name gets highlight 1), menu (user menu open), userHl */
function sidebar(opt){
  opt = opt || {};
  var items = ['+ New','Search','Projects','Artifacts','Scheduled','Customize'];
  var s = '<nav class="side"><div class="modes"><span class="on">Home</span><span>Code</span></div>';
  items.forEach(function(it){
    s += '<div class="it'+(opt.active===it?' on':'')+'"'+(opt.hl===it?' data-hl="1"':'')+'>'+it+'</div>';
  });
  s += '<div class="sec">Pinned</div><div class="sec">Chats and tasks</div>';
  (opt.recents || []).forEach(function(r){ s += '<div class="it">'+r+'</div>'; });
  s += '<div class="grow"></div>';
  if (opt.menu) s += '<div class="menu"><div class="muted">student@example.com</div><div'+h(2,true)+'>Settings</div><div>Help</div><div>Log out</div></div>';
  s += '<div class="user"'+h(1, opt.userHl)+'><span class="av">S</span><span>Student <span class="plan">· Pro</span></span></div></nav>';
  return s;
}
function app(side, main, overlay){ return '<div class="app'+(overlay?' tall':'')+'">'+side+'<div class="main">'+main+'</div>'+(overlay||'')+'</div>'; }
var HOME = '<h2>Good afternoon</h2><div class="composer">How can I help you today?</div>';
/* account settings modal. groups separated by '|' */
var SETNAV = ['Search','Account','Billing','Usage','|','Appearance','Your Claude','Capabilities','Notifications','Privacy','Wellbeing','|','Customize','Code','Cowork','|','Desktop app','|','API keys'];
function navList(title, list, on, hlItem){

   screen: function(){ return chat('משימת סיום', [], '<div class="msg me" style="max-width:none;margin:0"'+h(1,true)+'>'+esc(P.finish)+'</div>'); } },
 { ch:'6. משימת הסיום', title:'עונים על רשימת הבדיקה',
   do:'<p>קלוד עובר אתכם על רשימת הבדיקה, שורה אחת בכל פעם (1). עונים בכנות. אם משהו לא מוכן, חוזרים לפרק שלו ואז ממשיכים.</p><p>הרשימה: גיטהאב והכונן מחוברים. יש פרויקט עם מטרה והנחיות. המאגר מחובר. קבצי ההקשר שמורים בזיכרון. העדפות כתובות והזיכרון מופעל.</p>',
   screen: function(){ return chat('משימת סיום', [['me','אני מגיש/ה את משימת הסיום של הדרכת קלוד…'], ['ai','קראתי את ההוראות. נעבור על הרשימה.\nשורה 1: גיטהאב והכונן של גוגל מחוברים. זה מוכן?', 1], ['me','כן']], null); } },
 { ch:'6. משימת הסיום', title:'בודקים את הקובץ ומאשרים',
   do:'<p>קלוד מראה את הקובץ לפני שהוא מגיש. קוראים אותו (1). מהקבצים מופיעים רק שמות, בלי התוכן של הקובץ הפרטי. רק אם הכול נכון, כותבים שמאשרים.</p>',
   screen: function(){ return chat('משימת סיום', [['ai','זה הקובץ שאגיש:'], ['ai','<div data-hl="1" style="direction:ltr;text-align:left;font-family:ui-monospace,monospace;font-size:12px"># setup.md\n## Checklist\n- [x] GitHub and Google Drive\n- [x] Project goal and instructions\n- [x] Repository added\n- [x] Context files in project memory\n- [x] Preferences and memory\n## Files\ncontext.md, me.private.md (name only)</div>'], ['me','מאשר/ת']], null); } },
 { ch:'6. משימת הסיום', title:'הבקשה נכנסת לבד',
   do:'<p>קלוד פותח בקשת מיזוג ונותן קישור. בקשה שנוגעת רק בתיקייה שלכם ועוברת את הבדיקות נכנסת לבד תוך כמה דקות, ומסומנת בסגול (1).</p><p>לא נכנסה? בודקים שהקבצים רק בתיקייה שלכם ושאין שם קובץ בעברית. קלוד יסביר מה נכשל.</p>',

   screen: function(){ return chat('מה חדש במאגר', [], '<div class="msg me" style="max-width:none;margin:0"'+h(2,true)+'>'+marks(EDITS.sync != null ? EDITS.sync : P.sync)+'</div>').replace('<h2>מה חדש במאגר</h2>', '<h2 data-hl="1" style="display:inline-block">מה חדש במאגר</h2>'); } }

/* ---------- player ---------- */
var i = 0;
var sel = document.getElementById('chap');
var chapters = [];
SLIDES.forEach(function(s, k){ if (chapters.indexOf(s.ch) < 0) { chapters.push(s.ch); var o = document.createElement('option'); o.value = k; o.textContent = s.ch; sel.appendChild(o); } });
function show(n){
  i = Math.max(0, Math.min(SLIDES.length - 1, n));
  var s = SLIDES[i];
  document.getElementById('ch').textContent = s.ch;
  document.getElementById('title').textContent = s.title;
  document.getElementById('do').innerHTML = s.do;
  document.getElementById('screen').innerHTML = s.screen();
  document.getElementById('count').textContent = (i + 1) + ' מתוך ' + SLIDES.length;
  document.getElementById('bar').style.width = ((i + 1) / SLIDES.length * 100) + '%';
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === SLIDES.length - 1;
  var first = 0; SLIDES.forEach(function(x, k){ if (x.ch === s.ch && k <= i && (k === 0 || SLIDES[k-1].ch !== s.ch)) first = k; });
  sel.value = String(first);
  try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
}
document.getElementById('prev').onclick = function(){ show(i - 1); };
document.getElementById('next').onclick = function(){ show(i + 1); };
sel.onchange = function(){ show(parseInt(sel.value, 10)); };
document.addEventListener('keydown', function(e){
  if (e.target.tagName === 'SELECT' || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft' || e.key === 'PageDown') show(i + 1);
  if (e.key === 'ArrowRight' || e.key === 'PageUp') show(i - 1);
});
/* keep what the student typed, so the mock screen and later slides show it too */
document.addEventListener('input', function(e){
  var t = e.target.closest && e.target.closest('.copy .t[data-key]'); if (!t) return;
  EDITS[t.dataset.key] = t.innerText.replace(/\n$/, '');
  try { localStorage.setItem('hitme-claude-slides-v1', JSON.stringify(EDITS)); } catch (err) {}
});
document.addEventListener('focusout', function(e){
  var t = e.target.closest && e.target.closest('.copy .t[data-key]'); if (!t) return;
  document.getElementById('screen').innerHTML = SLIDES[i].screen();
});
document.addEventListener('click', function(e){
  var b = e.target.closest('.copy .head button'); if (!b) return;
  var t = b.closest('.copy').querySelector('.t').innerText.replace(/\n$/, '');
  var done = function(){ b.textContent = 'הועתק'; setTimeout(function(){ b.textContent = 'העתק'; }, 1500); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t).then(done, function(){}); return; }
  var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { if (document.execCommand('copy')) done(); } catch (err) {}
  document.body.removeChild(ta);
});
var start = parseInt((location.hash || '#1').slice(1), 10);
show(isNaN(start) ? 0 : start - 1);
</script>
